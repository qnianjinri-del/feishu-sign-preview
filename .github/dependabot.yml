version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gateway-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
    groups:
      desktop-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
