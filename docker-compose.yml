services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://sign.example.com}
      DEFAULT_JUMP_URL: ${DEFAULT_JUMP_URL:-https://sign.example.com/}
      DEFAULT_HELP_PATH: ${DEFAULT_HELP_PATH:-/}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      BITABLE_APP_TOKEN: ${BITABLE_APP_TOKEN:-}
      BITABLE_TABLE_ID: ${BITABLE_TABLE_ID:-}
      BITABLE_VIEW_ID: ${BITABLE_VIEW_ID:-}
      BITABLE_RESULT_FIELD_NAME: ${BITABLE_RESULT_FIELD_NAME:-任务名}
      BITABLE_STATUS_FIELD_NAME: ${BITABLE_STATUS_FIELD_NAME:-任务状态}
      BITABLE_SUBTASK_STATUS_FIELD_NAME: ${BITABLE_SUBTASK_STATUS_FIELD_NAME:-子状态}
      BITABLE_CHILD_STATUS_FIELD_NAME: ${BITABLE_CHILD_STATUS_FIELD_NAME:-FloatList子事项状态}
      BITABLE_SUBTASK_DATA_FIELD_NAME: ${BITABLE_SUBTASK_DATA_FIELD_NAME:-FloatList子事项数据}
      BITABLE_SYNC_ID_FIELD_NAME: ${BITABLE_SYNC_ID_FIELD_NAME:-FloatList同步ID}
      BITABLE_ORDER_FIELD_NAME: ${BITABLE_ORDER_FIELD_NAME:-FloatList顺序}
      BITABLE_ARCHIVED_FIELD_NAME: ${BITABLE_ARCHIVED_FIELD_NAME:-FloatList归档}
      BITABLE_PARENT_ID_FIELD_NAME: ${BITABLE_PARENT_ID_FIELD_NAME:-FloatList父事项ID}
      BITABLE_BLOCKED_REASON_FIELD_NAME: ${BITABLE_BLOCKED_REASON_FIELD_NAME:-FloatList受阻原因}
      BITABLE_DUE_DATE_FIELD_NAME: ${BITABLE_DUE_DATE_FIELD_NAME:-日期}
      BITABLE_DUE_TIME_FIELD_NAME: ${BITABLE_DUE_TIME_FIELD_NAME:-FloatList截止时刻}
      BITABLE_PRIORITY_FIELD_NAME: ${BITABLE_PRIORITY_FIELD_NAME:-优先级}
      BITABLE_REMINDER_AT_FIELD_NAME: ${BITABLE_REMINDER_AT_FIELD_NAME:-FloatList提醒时间}
      FLOATLIST_TIME_ZONE: ${FLOATLIST_TIME_ZONE:-Asia/Shanghai}
      BITABLE_TARGET_STATUS: ${BITABLE_TARGET_STATUS:-在干}
      BITABLE_CACHE_TTL_SECONDS: ${BITABLE_CACHE_TTL_SECONDS:-60}
      BITABLE_REQUEST_TIMEOUT_MS: ${BITABLE_REQUEST_TIMEOUT_MS:-1500}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-80}
      ENABLE_CARD_PREVIEW: ${ENABLE_CARD_PREVIEW:-false}
      HANDLER_TIMEOUT_MS: ${HANDLER_TIMEOUT_MS:-1500}
      DEBUG_TIMEOUT_MS: ${DEBUG_TIMEOUT_MS:-2000}
      FLOATLIST_CLIENT_TOKEN: ${FLOATLIST_CLIENT_TOKEN:-}
      FLOATLIST_SYNC_BODY_LIMIT: ${FLOATLIST_SYNC_BODY_LIMIT:-131072}
      FLOATLIST_IDEMPOTENCY_TTL_SECONDS: ${FLOATLIST_IDEMPOTENCY_TTL_SECONDS:-3600}
      FLOATLIST_RATE_LIMIT_WINDOW_SECONDS: ${FLOATLIST_RATE_LIMIT_WINDOW_SECONDS:-60}
      FLOATLIST_RATE_LIMIT_MAX_REQUESTS: ${FLOATLIST_RATE_LIMIT_MAX_REQUESTS:-120}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${PORT:-3000}/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
