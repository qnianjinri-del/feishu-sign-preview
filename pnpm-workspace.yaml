packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  esbuild: true
  protobufjs: true

overrides:
  fast-uri: 3.1.5
  postcss: 8.5.23
  undici: 7.29.0
  brace-expansion: 5.0.9
  nanoid: 3.3.17

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@floatlist/contracts"
  - "@tauri-apps/*"
  - "tauri"
  - "tauri-build"
  - "tauri-plugin-*"
